{% if page.has_other_pages %}<nav class="formal-actions formal-pagination" aria-label="{{ label }} pages">
  {% if page.has_previous %}<a class="btn btn-small btn-ghost" href="?{{ parameter }}={{ page.previous_page_number }}#{{ anchor }}">Previous</a>{% endif %}
  <span class="small">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="btn btn-small btn-ghost" href="?{{ parameter }}={{ page.next_page_number }}#{{ anchor }}">Next</a>{% endif %}
</nav>{% endif %}
