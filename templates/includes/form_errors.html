{% if form.errors %}<div class="form-errors" role="alert" tabindex="-1" data-error-summary>
  <h2>Check the highlighted details</h2>
  {{ form.non_field_errors }}
  <ul>{% for field in form %}{% for error in field.errors %}<li>{% if not field.is_hidden %}<a href="#{{ field.auto_id }}">{{ field.label }}: {{ error }}</a>{% else %}{{ error }}{% endif %}</li>{% endfor %}{% endfor %}</ul>
</div>{% endif %}
